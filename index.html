<head>

  <style>
    :root {
      --app-height: 100dvh;
      --safe-top: env(safe-area-inset-top);
      --safe-right: env(safe-area-inset-right);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-height);
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: #000;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    #unity-container {
      position: fixed;
      left: var(--safe-left);
      right: var(--safe-right);
      top: var(--safe-top);
      bottom: var(--safe-bottom);
      width: calc(100vw - var(--safe-left) - var(--safe-right));
      height: calc(var(--app-height) - var(--safe-top) - var(--safe-bottom));
      background: #000;
      overflow: hidden;
    }

    #unity-canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      background: #000;
      outline: none;
      touch-action: none;
    }

    input,
    textarea,
    select,
    .tmp-input,
    .unity-input,
    #unity-container input,
    #unity-container textarea,
    body input,
    body textarea {
      font-size: 16px !important;
      line-height: 20px !important;
      transform: none !important;
      zoom: 1 !important;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    /* LOADING SCREEN */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding:
        max(24px, var(--safe-top))
        max(24px, var(--safe-right))
        max(24px, var(--safe-bottom))
        max(24px, var(--safe-left));
      background:
        radial-gradient(
          ellipse at 50% 44%,
          rgba(247, 229, 239, 0.34) 0%,
          rgba(238, 231, 248, 0.16) 34%,
          rgba(252, 250, 252, 0) 68%
        ),
        linear-gradient(145deg, #fffdfb 0%, #fcfafc 52%, #faf8fc 100%);
      opacity: 1;
      transition: opacity 0.7s ease;
      pointer-events: none;
      overflow: hidden;
    }

    #loading-screen.hidden {
      opacity: 0;
    }

    /* Centered logo and determinate progress presentation. */
    .loading-composition {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 4.5vmin, 40px);
      width: min(100%, 420px);
      max-height: 100%;
    }

    /* Preserve the logo's square aspect ratio at every viewport size. */
    .loading-logo {
      display: block;
      width: clamp(112px, 22vmin, 192px);
      height: auto;
      max-width: 48vw;
      max-height: 42vh;
      object-fit: contain;
      flex: 0 1 auto;
    }

    /* Thin, restrained progress indicator driven by createUnityInstance. */
    #progress-area {
      width: min(72vw, 360px);
    }

    #progress-track {
      width: 100%;
      height: 4px;
      background: rgba(123, 100, 120, 0.12);
      border-radius: 999px;
      overflow: hidden;
    }

    #progress-fill {
      width: 100%;
      height: 100%;
      transform: scaleX(0);
      transform-origin: left center;
      border-radius: inherit;
      background: linear-gradient(90deg, #dc9eb9 0%, #bea5d8 100%);
      transition: transform 0.15s linear;
    }

    /* Keep the composition balanced on very short landscape viewports. */
    @media (max-height: 360px) {
      .loading-composition {
        gap: 20px;
      }

      .loading-logo {
        width: 96px;
        max-height: 46vh;
      }
    }
  </style>

    (function () {
      // Set to false to restore the original viewport handlers on every browser.
      var ENABLE_MOBILE_WEBGL_KEYBOARD_VIEWPORT_LOCK = true;

      function setAppHeight() {
        var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-height', h + 'px');

        var canvas = document.getElementById('unity-canvas');

      function installLegacyViewportBehavior() {
        setAppHeight();

        window.addEventListener('resize', setAppHeight);

        window.addEventListener('orientationchange', function () {
          setTimeout(setAppHeight, 250);
          setTimeout(setAppHeight, 800);
        });

        if (window.visualViewport) {

            setTimeout(setAppHeight, 50);
          });

            window.scrollTo(0, 0);
          });
        }

        document.addEventListener('focusout', function () {
          setTimeout(setAppHeight, 80);
          setTimeout(setAppHeight, 250);
        }, true);
      }

      function isSupportedMobileBrowser() {
        var userAgent = navigator.userAgent || '';
        var isMobileUserAgent = /Android|iPhone|iPad|iPod/i.test(userAgent);
        var isIpadOsDesktopMode =
          navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        return isMobileUserAgent || isIpadOsDesktopMode;
      }

      if (!ENABLE_MOBILE_WEBGL_KEYBOARD_VIEWPORT_LOCK || !isSupportedMobileBrowser()) {
        installLegacyViewportBehavior();
        return;
      }

      var HEIGHT_EPSILON_PX = 0.5;
      var REQUIRED_STABLE_FRAMES = 3;
      var REQUIRED_STABLE_MS = 120;

      var lastStableAppHeight = getViewportHeight();
      var keyboardViewportLocked = false;
      var restoringViewport = false;
      var transitionGeneration = 0;
      var pendingTimers = [];
      var restoreAnimationFrame = 0;
      var blurredUnityInput = null;
      var focusoutViewportHeight = lastStableAppHeight;
      var lastObservedViewportHeight = lastStableAppHeight;
      var lastViewportHeightChangeAt = now();
      var stableFrameCount = 0;
      var viewportRestorationObserved = false;

      function getViewportHeight() {
        return window.visualViewport ? window.visualViewport.height : window.innerHeight;
      }

      function now() {
        return window.performance && window.performance.now
          ? window.performance.now()
          : Date.now();
      }

      function heightsMatch(a, b) {
        return Math.abs(a - b) <= HEIGHT_EPSILON_PX;
      }

      function applyHeight(height, scrollToTop) {
        document.documentElement.style.setProperty('--app-height', height + 'px');

        var canvas = document.getElementById('unity-canvas');
        if (canvas) {
          canvas.style.width = '100%';
          canvas.style.height = '100%';
        }

        if (scrollToTop) {
          window.scrollTo(0, 0);
        }
      }

      function applyCurrentStableHeight() {
        if (keyboardViewportLocked) {
          return;
        }

        var height = getViewportHeight();
        applyHeight(height, true);
        lastStableAppHeight = height;
      }

      function isUnityGeneratedInput(element) {
        if (!element) {
          return false;
        }

        var tagName = element.tagName;
        if (tagName !== 'INPUT' && tagName !== 'TEXTAREA') {
          return false;
        }

        var parent = element.parentNode;
        return !!parent && parent.input === element;
      }

      function removePendingTimer(timerId) {
        var index = pendingTimers.indexOf(timerId);
        if (index >= 0) {
          pendingTimers.splice(index, 1);
        }
      }

      function cancelPendingTimers() {
        for (var i = 0; i < pendingTimers.length; i++) {
          clearTimeout(pendingTimers[i]);
        }
        pendingTimers.length = 0;
      }

      function cancelRestoreAnimationFrame() {
        if (restoreAnimationFrame) {
          window.cancelAnimationFrame(restoreAnimationFrame);
          restoreAnimationFrame = 0;
        }
      }

      function cancelPendingViewportWork() {
        cancelPendingTimers();
        cancelRestoreAnimationFrame();
      }

      function scheduleStableHeightUpdate(delay) {
        var scheduledGeneration = transitionGeneration;
        var timerId = setTimeout(function () {
          removePendingTimer(timerId);
          if (scheduledGeneration !== transitionGeneration || keyboardViewportLocked) {
            return;
          }
          applyCurrentStableHeight();
        }, delay);
        pendingTimers.push(timerId);
      }

      function beginKeyboardViewportLock(unityInput) {
        transitionGeneration++;
        cancelPendingViewportWork();
        keyboardViewportLocked = true;
        restoringViewport = false;
        blurredUnityInput = null;
        viewportRestorationObserved = false;

        // Restore the last keyboard-closed height without moving the document.
        applyHeight(lastStableAppHeight, false);
      }

      function completeViewportRestore(height) {
        transitionGeneration++;
        cancelPendingViewportWork();
        restoringViewport = false;
        keyboardViewportLocked = false;
        blurredUnityInput = null;
        viewportRestorationObserved = false;
        applyHeight(height, true);
        lastStableAppHeight = height;
      }

      function scheduleRestoreProbe(generation) {
        if (restoreAnimationFrame || generation !== transitionGeneration) {
          return;
        }

        restoreAnimationFrame = window.requestAnimationFrame(function (timestamp) {
          restoreAnimationFrame = 0;

          if (
            generation !== transitionGeneration ||
            !keyboardViewportLocked ||
            !restoringViewport
          ) {
            return;
          }

          var activeElement = document.activeElement;
          if (isUnityGeneratedInput(activeElement)) {
            beginKeyboardViewportLock(activeElement);
            return;
          }

          // Unity keeps its generated bridge alive briefly so a direct input
          // switch can reuse it. Do not begin restoration until that bridge
          // has actually been released.
          if (blurredUnityInput && isUnityGeneratedInput(blurredUnityInput)) {
            scheduleRestoreProbe(generation);
            return;
          }

          var height = getViewportHeight();
          if (!heightsMatch(height, lastObservedViewportHeight)) {
            lastObservedViewportHeight = height;
            lastViewportHeightChangeAt = timestamp;
            stableFrameCount = 0;
          } else {
            stableFrameCount++;
          }

          if (
            heightsMatch(height, lastStableAppHeight) ||
            !heightsMatch(height, focusoutViewportHeight)
          ) {
            viewportRestorationObserved = true;
          }

          if (
            viewportRestorationObserved &&
            stableFrameCount >= REQUIRED_STABLE_FRAMES &&
            timestamp - lastViewportHeightChangeAt >= REQUIRED_STABLE_MS
          ) {
            completeViewportRestore(height);
            return;
          }

          scheduleRestoreProbe(generation);
        });
      }

      function beginViewportRestore(unityInput) {
        transitionGeneration++;
        cancelPendingViewportWork();
        keyboardViewportLocked = true;
        restoringViewport = true;
        blurredUnityInput = unityInput;
        focusoutViewportHeight = getViewportHeight();
        lastObservedViewportHeight = focusoutViewportHeight;
        lastViewportHeightChangeAt = now();
        stableFrameCount = 0;
        viewportRestorationObserved =
          heightsMatch(focusoutViewportHeight, lastStableAppHeight);
        scheduleRestoreProbe(transitionGeneration);
      }

      function handleViewportResize() {
        if (keyboardViewportLocked) {
          if (restoringViewport) {
            scheduleRestoreProbe(transitionGeneration);
          }
          return;
        }

        applyCurrentStableHeight();
      }

      function handleOrientationChange() {
        if (keyboardViewportLocked) {
          cancelPendingTimers();
          if (restoringViewport) {
            scheduleRestoreProbe(transitionGeneration);
          }
          return;
        }

        scheduleStableHeightUpdate(250);
        scheduleStableHeightUpdate(800);
      }

      applyCurrentStableHeight();

      window.addEventListener('resize', handleViewportResize);

      window.addEventListener('orientationchange', handleOrientationChange);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
          if (keyboardViewportLocked) {
            if (restoringViewport) {
              scheduleRestoreProbe(transitionGeneration);
            }
            return;
          }

          scheduleStableHeightUpdate(50);
        });

        window.visualViewport.addEventListener('scroll', function () {
          if (!keyboardViewportLocked) {
            window.scrollTo(0, 0);
          }
        });
      }

      document.addEventListener('focusin', function (event) {
        if (isUnityGeneratedInput(event.target)) {
          beginKeyboardViewportLock(event.target);
        }
      }, true);

      document.addEventListener('focusout', function (event) {
        if (isUnityGeneratedInput(event.target)) {
          beginViewportRestore(event.target);
          return;
        }

        if (!keyboardViewportLocked) {
          scheduleStableHeightUpdate(80);
          scheduleStableHeightUpdate(250);
        }
      }, true);
    })();
  </script>

      const wrap = document.getElementById("google-unity-overlay");

      window.visualViewport.addEventListener("scroll", renderVisibleOverlay);
    }
  })();
</script>
