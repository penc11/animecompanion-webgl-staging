<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>AnimeCompanion</title>

  <style>
    :root {
      --app-height: 100dvh;
      --safe-top: env(safe-area-inset-top);
      --safe-right: env(safe-area-inset-right);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-height);
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: #000;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    #unity-container {
      position: fixed;
      left: var(--safe-left);
      right: var(--safe-right);
      top: var(--safe-top);
      bottom: var(--safe-bottom);
      width: calc(100vw - var(--safe-left) - var(--safe-right));
      height: calc(var(--app-height) - var(--safe-top) - var(--safe-bottom));
      background: #000;
      overflow: hidden;
    }

    #unity-canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      background: #000;
      outline: none;
      touch-action: none;
    }

    input,
    textarea,
    select,
    .tmp-input,
    .unity-input,
    #unity-container input,
    #unity-container textarea,
    body input,
    body textarea {
      font-size: 16px !important;
      line-height: 20px !important;
      transform: none !important;
      zoom: 1 !important;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    /* LOADING SCREEN */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.05), rgba(0,0,0,0.95) 60%),
        #000;
      opacity: 1;
      transition: opacity 0.7s ease;
      pointer-events: none;
      overflow: hidden;
    }

    #loading-screen.hidden {
      opacity: 0;
    }

    /* Blur/fade loop animasyonu için glow katmanları */
    .blur-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.18;
      mix-blend-mode: screen;
      animation: pulse 3s ease-in-out infinite;
    }

    .orb1 {
      width: 260px;
      height: 260px;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.9);
      animation-delay: 0s;
    }

    .orb2 {
      width: 180px;
      height: 180px;
      left: 42%;
      top: 52%;
      transform: translate(-50%, -50%);
      background: rgba(180,180,180,0.7);
      animation-delay: 0.7s;
    }

    .orb3 {
      width: 220px;
      height: 220px;
      left: 58%;
      top: 48%;
      transform: translate(-50%, -50%);
      background: rgba(220,220,220,0.6);
      animation-delay: 1.4s;
    }

    @keyframes pulse {
      0% {
        opacity: 0.10;
        filter: blur(40px);
        transform: translate(-50%, -50%) scale(0.85);
      }
      50% {
        opacity: 0.32;
        filter: blur(80px);
        transform: translate(-50%, -50%) scale(1.15);
      }
      100% {
        opacity: 0.10;
        filter: blur(40px);
        transform: translate(-50%, -50%) scale(0.85);
      }
    }

    /* Ortadaki yazı/logo alanı */
    #loading-title {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      opacity: 0.92;
    }

    /* Alt progress alanı */
    #progress-area {
      position: absolute;
      left: 50%;
      bottom: 42px;
      transform: translateX(-50%);
      width: min(78vw, 720px);
    }

    #progress-text {
      color: rgba(255,255,255,0.85);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 0.06em;
    }

    #progress-track {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.14);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    #progress-fill {
      width: 100%;
      height: 100%;
      transform: scaleX(0);
      transform-origin: left center;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffffff 0%, #bdbdbd 100%);
      transition: transform 0.15s linear;
    }

    /* Küçük cihazlar */
    @media (max-width: 600px) {
      #loading-title {
        font-size: 20px;
      }

      #progress-area {
        width: 86vw;
        bottom: 28px;
      }

      .orb1 { width: 180px; height: 180px; }
      .orb2 { width: 140px; height: 140px; }
      .orb3 { width: 160px; height: 160px; }
    }
  </style>

  <script>
    (function () {
      // Set to false to restore the original viewport handlers on every browser.
      var ENABLE_MOBILE_WEBGL_KEYBOARD_VIEWPORT_LOCK = true;

      function setAppHeight() {
        var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-height', h + 'px');

        var canvas = document.getElementById('unity-canvas');
        if (canvas) {
          canvas.style.width = '100%';
          canvas.style.height = '100%';
        }

        window.scrollTo(0, 0);
      }

      function installLegacyViewportBehavior() {
        setAppHeight();

        window.addEventListener('resize', setAppHeight);

        window.addEventListener('orientationchange', function () {
          setTimeout(setAppHeight, 250);
          setTimeout(setAppHeight, 800);
        });

        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () {
            setTimeout(setAppHeight, 50);
          });

          window.visualViewport.addEventListener('scroll', function () {
            window.scrollTo(0, 0);
          });
        }

        document.addEventListener('focusout', function () {
          setTimeout(setAppHeight, 80);
          setTimeout(setAppHeight, 250);
        }, true);
      }

      function isSupportedMobileBrowser() {
        var userAgent = navigator.userAgent || '';
        var isMobileUserAgent = /Android|iPhone|iPad|iPod/i.test(userAgent);
        var isIpadOsDesktopMode =
          navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        return isMobileUserAgent || isIpadOsDesktopMode;
      }

      if (!ENABLE_MOBILE_WEBGL_KEYBOARD_VIEWPORT_LOCK || !isSupportedMobileBrowser()) {
        installLegacyViewportBehavior();
        return;
      }

      var HEIGHT_EPSILON_PX = 0.5;
      var REQUIRED_STABLE_FRAMES = 3;
      var REQUIRED_STABLE_MS = 120;

      var lastStableAppHeight = getViewportHeight();
      var keyboardViewportLocked = false;
      var restoringViewport = false;
      var transitionGeneration = 0;
      var pendingTimers = [];
      var restoreAnimationFrame = 0;
      var blurredUnityInput = null;
      var focusoutViewportHeight = lastStableAppHeight;
      var lastObservedViewportHeight = lastStableAppHeight;
      var lastViewportHeightChangeAt = now();
      var stableFrameCount = 0;
      var viewportRestorationObserved = false;

      function getViewportHeight() {
        return window.visualViewport ? window.visualViewport.height : window.innerHeight;
      }

      function now() {
        return window.performance && window.performance.now
          ? window.performance.now()
          : Date.now();
      }

      function heightsMatch(a, b) {
        return Math.abs(a - b) <= HEIGHT_EPSILON_PX;
      }

      function applyHeight(height, scrollToTop) {
        document.documentElement.style.setProperty('--app-height', height + 'px');

        var canvas = document.getElementById('unity-canvas');
        if (canvas) {
          canvas.style.width = '100%';
          canvas.style.height = '100%';
        }

        if (scrollToTop) {
          window.scrollTo(0, 0);
        }
      }

      function applyCurrentStableHeight() {
        if (keyboardViewportLocked) {
          return;
        }

        var height = getViewportHeight();
        applyHeight(height, true);
        lastStableAppHeight = height;
      }

      function isUnityGeneratedInput(element) {
        if (!element) {
          return false;
        }

        var tagName = element.tagName;
        if (tagName !== 'INPUT' && tagName !== 'TEXTAREA') {
          return false;
        }

        var parent = element.parentNode;
        return !!parent && parent.input === element;
      }

      function removePendingTimer(timerId) {
        var index = pendingTimers.indexOf(timerId);
        if (index >= 0) {
          pendingTimers.splice(index, 1);
        }
      }

      function cancelPendingTimers() {
        for (var i = 0; i < pendingTimers.length; i++) {
          clearTimeout(pendingTimers[i]);
        }
        pendingTimers.length = 0;
      }

      function cancelRestoreAnimationFrame() {
        if (restoreAnimationFrame) {
          window.cancelAnimationFrame(restoreAnimationFrame);
          restoreAnimationFrame = 0;
        }
      }

      function cancelPendingViewportWork() {
        cancelPendingTimers();
        cancelRestoreAnimationFrame();
      }

      function scheduleStableHeightUpdate(delay) {
        var scheduledGeneration = transitionGeneration;
        var timerId = setTimeout(function () {
          removePendingTimer(timerId);
          if (scheduledGeneration !== transitionGeneration || keyboardViewportLocked) {
            return;
          }
          applyCurrentStableHeight();
        }, delay);
        pendingTimers.push(timerId);
      }

      function beginKeyboardViewportLock(unityInput) {
        transitionGeneration++;
        cancelPendingViewportWork();
        keyboardViewportLocked = true;
        restoringViewport = false;
        blurredUnityInput = null;
        viewportRestorationObserved = false;

        // Restore the last keyboard-closed height without moving the document.
        applyHeight(lastStableAppHeight, false);
      }

      function completeViewportRestore(height) {
        transitionGeneration++;
        cancelPendingViewportWork();
        restoringViewport = false;
        keyboardViewportLocked = false;
        blurredUnityInput = null;
        viewportRestorationObserved = false;
        applyHeight(height, true);
        lastStableAppHeight = height;
      }

      function scheduleRestoreProbe(generation) {
        if (restoreAnimationFrame || generation !== transitionGeneration) {
          return;
        }

        restoreAnimationFrame = window.requestAnimationFrame(function (timestamp) {
          restoreAnimationFrame = 0;

          if (
            generation !== transitionGeneration ||
            !keyboardViewportLocked ||
            !restoringViewport
          ) {
            return;
          }

          var activeElement = document.activeElement;
          if (isUnityGeneratedInput(activeElement)) {
            beginKeyboardViewportLock(activeElement);
            return;
          }

          // Unity keeps its generated bridge alive briefly so a direct input
          // switch can reuse it. Do not begin restoration until that bridge
          // has actually been released.
          if (blurredUnityInput && isUnityGeneratedInput(blurredUnityInput)) {
            scheduleRestoreProbe(generation);
            return;
          }

          var height = getViewportHeight();
          if (!heightsMatch(height, lastObservedViewportHeight)) {
            lastObservedViewportHeight = height;
            lastViewportHeightChangeAt = timestamp;
            stableFrameCount = 0;
          } else {
            stableFrameCount++;
          }

          if (
            heightsMatch(height, lastStableAppHeight) ||
            !heightsMatch(height, focusoutViewportHeight)
          ) {
            viewportRestorationObserved = true;
          }

          if (
            viewportRestorationObserved &&
            stableFrameCount >= REQUIRED_STABLE_FRAMES &&
            timestamp - lastViewportHeightChangeAt >= REQUIRED_STABLE_MS
          ) {
            completeViewportRestore(height);
            return;
          }

          scheduleRestoreProbe(generation);
        });
      }

      function beginViewportRestore(unityInput) {
        transitionGeneration++;
        cancelPendingViewportWork();
        keyboardViewportLocked = true;
        restoringViewport = true;
        blurredUnityInput = unityInput;
        focusoutViewportHeight = getViewportHeight();
        lastObservedViewportHeight = focusoutViewportHeight;
        lastViewportHeightChangeAt = now();
        stableFrameCount = 0;
        viewportRestorationObserved =
          heightsMatch(focusoutViewportHeight, lastStableAppHeight);
        scheduleRestoreProbe(transitionGeneration);
      }

      function handleViewportResize() {
        if (keyboardViewportLocked) {
          if (restoringViewport) {
            scheduleRestoreProbe(transitionGeneration);
          }
          return;
        }

        applyCurrentStableHeight();
      }

      function handleOrientationChange() {
        if (keyboardViewportLocked) {
          cancelPendingTimers();
          if (restoringViewport) {
            scheduleRestoreProbe(transitionGeneration);
          }
          return;
        }

        scheduleStableHeightUpdate(250);
        scheduleStableHeightUpdate(800);
      }

      applyCurrentStableHeight();

      window.addEventListener('resize', handleViewportResize);

      window.addEventListener('orientationchange', handleOrientationChange);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
          if (keyboardViewportLocked) {
            if (restoringViewport) {
              scheduleRestoreProbe(transitionGeneration);
            }
            return;
          }

          scheduleStableHeightUpdate(50);
        });

        window.visualViewport.addEventListener('scroll', function () {
          if (!keyboardViewportLocked) {
            window.scrollTo(0, 0);
          }
        });
      }

      document.addEventListener('focusin', function (event) {
        if (isUnityGeneratedInput(event.target)) {
          beginKeyboardViewportLock(event.target);
        }
      }, true);

      document.addEventListener('focusout', function (event) {
        if (isUnityGeneratedInput(event.target)) {
          beginViewportRestore(event.target);
          return;
        }

        if (!keyboardViewportLocked) {
          scheduleStableHeightUpdate(80);
          scheduleStableHeightUpdate(250);
        }
      }, true);
    })();
  </script>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingScreen = document.querySelector("#loading-screen");
    const progressFill = document.querySelector("#progress-fill");
    const progressText = document.querySelector("#progress-text");

    const config = {
      dataUrl: "Build/660e20407ac94d022af25c636d695159.data.br",
      frameworkUrl: "Build/399f5c5012880994f644519b5d862edf.framework.js.br",

      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "AnimeCompanion",
      productVersion: "0.1.0",
      matchWebGLToCanvasSize: true
    };

    createUnityInstance(canvas, config, (progress) => {
      const value = Math.max(0, Math.min(1, progress));
      progressFill.style.transform = `scaleX(${value})`;
      progressText.textContent = `Loading ${Math.round(value * 100)}%`;
    }).then((unityInstance) => {
      loadingScreen.classList.add("hidden");

        loadingScreen.remove();

      window.unityInstance = unityInstance;

  <div id="google-unity-overlay"
     style="display:none; position:fixed; left:0; top:0; width:0; height:0; z-index:99999; pointer-events:none;">
  <div id="google-unity-overlay-inner"
       style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; pointer-events:auto; opacity:0.001;">
  </div>
</div>

<script>
  (function () {
    const state = {
      clientId: "",
      inited: false,
      lastWidth: 0,
      lastUnityRect: null,
      initAttempts: 0,
      gisLoadErrorReported: false,
      renderErrorReported: false,
      pendingErrorCode: "",
      pendingErrorTimer: 0,
      renderCheckTimer: 0
    };

    function flushGoogleError() {
      if (!state.pendingErrorCode) return;

      if (window.unityInstance) {
        window.unityInstance.SendMessage(
          "GoogleAuthController",
          "OnWebGoogleError",
          state.pendingErrorCode
        );
        state.pendingErrorCode = "";
        state.pendingErrorTimer = 0;
        return;
      }

      window.clearTimeout(state.pendingErrorTimer);
      state.pendingErrorTimer = window.setTimeout(flushGoogleError, 250);
    }

    function sendGoogleError(code) {
      state.pendingErrorCode = code || "auth_google_failed";
      flushGoogleError();
    }

    function reportGisLoadFailure() {
      const wrap = document.getElementById("google-unity-overlay");
      if (wrap) wrap.style.display = "none";
      if (state.gisLoadErrorReported) return;
      state.gisLoadErrorReported = true;
      sendGoogleError("gsi_load_failed");
    }

    function hasUsableRenderedButton(root) {
      const iframe = root ? root.querySelector("iframe") : null;
      if (!iframe) return false;
      const rect = iframe.getBoundingClientRect();
      return rect.width >= 8 && rect.height >= 8;
    }

    function verifyRenderedButton(root) {
      window.clearTimeout(state.renderCheckTimer);
      state.renderCheckTimer = window.setTimeout(function () {
        if (hasUsableRenderedButton(root)) {
          state.renderErrorReported = false;
          return;
        }

        state.lastWidth = 0;
        if (state.renderErrorReported) return;
        state.renderErrorReported = true;
        sendGoogleError("gsi_button_unavailable");
      }, 500);
    }

    function ensureRendered(widthPx) {
      const root = document.getElementById("google-unity-overlay-inner");
      const wrap = document.getElementById("google-unity-overlay");
      if (!root || !wrap || wrap.style.display === "none") return;

      const rootRect = root.getBoundingClientRect();
      if (rootRect.width < 8 || rootRect.height < 8) {
        sendGoogleError("gsi_button_unavailable");
        return;
      }

      const w = Math.max(200, Math.min(400, Math.round(widthPx || rootRect.width)));
      if (Math.abs(state.lastWidth - w) < 4 && hasUsableRenderedButton(root)) return;

      root.innerHTML = "";

      if (!window.google || !google.accounts || !google.accounts.id) {
        if (window.__yorivaGoogleGisLoadFailed) reportGisLoadFailure();
        else sendGoogleError("gsi_not_ready");
        return;
      }

      try {
        google.accounts.id.renderButton(root, {
          theme: "outline",
          size: "large",
          shape: "pill",
          text: "continue_with",
          logo_alignment: "left",
          width: w
        });
      } catch (error) {
        state.lastWidth = 0;
        sendGoogleError("gsi_button_unavailable");
        return;
      }

      state.lastWidth = w;
      window.requestAnimationFrame(function () {
        verifyRenderedButton(root);
      });
    }

    function mapUnityRectToCss(left, top, width, height, canvas) {
      const rect = canvas.getBoundingClientRect();
      const bufferWidth = canvas.width || rect.width;
      const bufferHeight = canvas.height || rect.height;
      const scaleX = bufferWidth > 0 ? rect.width / bufferWidth : 1;
      const scaleY = bufferHeight > 0 ? rect.height / bufferHeight : 1;

      return {
        left: rect.left + left * scaleX,
        top: rect.top + top * scaleY,
        width: width * scaleX,
        height: height * scaleY
      };
    }

    function applyUnityOverlayRect() {
      const wrap = document.getElementById("google-unity-overlay");
      const canvas = document.getElementById("unity-canvas");
      if (!wrap || !canvas || !state.lastUnityRect) return null;

      const source = state.lastUnityRect;
      const mapped = mapUnityRectToCss(
        source.left,
        source.top,
        source.width,
        source.height,
        canvas
      );

      if (![mapped.left, mapped.top, mapped.width, mapped.height].every(Number.isFinite) ||
          mapped.width < 8 || mapped.height < 8) {
        sendGoogleError("gsi_button_unavailable");
        return null;
      }

      wrap.style.left = Math.round(mapped.left) + "px";
      wrap.style.top = Math.round(mapped.top) + "px";
      wrap.style.width = Math.round(mapped.width) + "px";
      wrap.style.height = Math.round(mapped.height) + "px";
      return mapped;
    }

    function renderVisibleOverlay() {
      const wrap = document.getElementById("google-unity-overlay");
      if (!wrap || wrap.style.display === "none" || !state.inited) return;
      const mapped = applyUnityOverlayRect();
      if (!mapped) return;
      window.requestAnimationFrame(function () {
        ensureRendered(mapped.width);
      });
    }

    function deliverGoogleCredential(credential, attempt) {
      if (window.unityInstance) {
        window.unityInstance.SendMessage(
          "GoogleAuthController",
          "OnWebGoogleIdToken",
          credential
        );
        return;
      }

      if ((attempt || 0) >= 20) {
        sendGoogleError("gsi_not_ready");
        return;
      }

      window.setTimeout(function () {
        deliverGoogleCredential(credential, (attempt || 0) + 1);
      }, 250);
    }

    window.initGoogleForUnityOverlay = function (webClientId) {
      if (!webClientId) {
        sendGoogleError("client_id_missing");
        return;
      }

      if (!/^\d+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$/.test(webClientId) ||
          /(your|placeholder|replace|example)/i.test(webClientId)) {
        sendGoogleError("client_id_invalid");
        return;
      }

      state.clientId = webClientId;

      if (state.inited) return;

      if (window.__yorivaGoogleGisLoadFailed) {
        reportGisLoadFailure();
        return;
      }

      if (!window.google || !google.accounts || !google.accounts.id) {
        state.initAttempts += 1;
        if (state.initAttempts >= 40) {
          sendGoogleError("gsi_not_ready");
          return;
        }
        setTimeout(function () {
          window.initGoogleForUnityOverlay(webClientId);
        }, 250);
        return;
      }

      try {
        google.accounts.id.initialize({
          client_id: webClientId,
          callback: function (response) {
            if (response && response.credential) {
              deliverGoogleCredential(response.credential, 0);
            } else {
              sendGoogleError("no_credential");
            }
          },
          ux_mode: "popup",
          auto_select: false
        });
      } catch (error) {
        state.inited = false;
        sendGoogleError("client_id_invalid");
        return;
      }

      state.inited = true;
      state.initAttempts = 0;
      renderVisibleOverlay();
    };

    window.showGoogleUnityOverlay = function (left, top, width, height) {
      const wrap = document.getElementById("google-unity-overlay");
      if (!wrap) return;

      if (window.__yorivaGoogleGisLoadFailed) {
        reportGisLoadFailure();
        return;
      }

      state.lastUnityRect = { left: left, top: top, width: width, height: height };
      wrap.style.display = "block";
      applyUnityOverlayRect();

      if (!state.inited && state.clientId) {
        window.initGoogleForUnityOverlay(state.clientId);
      } else {
        renderVisibleOverlay();
      }
    };

    window.hideGoogleUnityOverlay = function () {
      const wrap = document.getElementById("google-unity-overlay");
      if (wrap) wrap.style.display = "none";
    };

    window.addEventListener("resize", renderVisibleOverlay);
    window.addEventListener("yoriva-google-gis-error", reportGisLoadFailure);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", renderVisibleOverlay);
      window.visualViewport.addEventListener("scroll", renderVisibleOverlay);
    }
  })();
</script>
